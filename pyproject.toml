[project]
name = "pt-narrative-os"
version = "0.1.0"
description = "Portugal-first media narrative intelligence platform"
requires-python = ">=3.12"
license = {text = "Proprietary"}
dependencies = [
    # Database
    "asyncpg>=0.29",
    "sqlalchemy[asyncio]>=2.0",
    # Article extraction
    "trafilatura>=1.8",
    "langdetect>=1.0",
    "lxml>=5.0",
    # AI / Model clients
    "openai>=1.30",
    "numpy>=1.26",
    # Web / HTTP
    "httpx>=0.27",
    "feedparser>=6.0",
    # API
    "fastapi>=0.111",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30",
    # Scheduling
    "apscheduler>=3.10",
    # Templating (review UI)
    "jinja2>=3.1",
    # Utilities
    "python-dotenv>=1.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[tool.setuptools.packages.find]
include = ["ai", "db", "api", "review", "prompts", "services"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: marks tests requiring database (deselect with '-m \"not integration\"')",
    "slow: marks slow tests",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true